name: Release and Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  secret-scan:
    name: Scan release sources
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/') &&
      startsWith(github.event.pull_request.title, 'Release v') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag-commit: ${{ steps.source.outputs.tag-commit }}
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve publication sources
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          version=$(jq -er '.version | select(type == "string" and length > 0)' package.json)
          tag_commit=$(git rev-parse --verify "refs/tags/v$version^{commit}")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag-commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Prepare official Gitleaks image
        run: docker image inspect "$GITLEAKS_IMAGE" >/dev/null 2>&1 || docker pull "$GITLEAKS_IMAGE"
      - name: Scan publication histories offline
        env:
          SCAN_HEAD: ${{ steps.source.outputs.commit }}
          SCAN_TAG_HEAD: ${{ steps.source.outputs.tag-commit }}
        shell: bash
        run: |
          set -euo pipefail
          readonly FINDINGS_EXIT_CODE=20
          readonly SCAN_TIMEOUT_SECONDS=300 # Leave time for checkout and image preparation.
          [[ $(git rev-parse HEAD) == "$SCAN_HEAD" ]]
          [[ $(git rev-parse --is-shallow-repository) == false ]]
          range="$SCAN_HEAD $SCAN_TAG_HEAD"
          umask 077
          report=$(mktemp -d)
          trap 'rm -rf "$report"' EXIT
          mkdir "$report/objects"
          status=0
          docker run --rm --pull=never --network none --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_GLOBAL=/dev/null \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$report:/reports" \
            -e GIT_CONFIG_COUNT=3 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -e GIT_CONFIG_KEY_1=color.ui -e GIT_CONFIG_VALUE_1=false \
            -e GIT_CONFIG_KEY_2=color.diff -e GIT_CONFIG_VALUE_2=false \
            -e GIT_NO_REPLACE_OBJECTS=1 -e GIT_NO_LAZY_FETCH=1 \
            -e GIT_OBJECT_DIRECTORY=/reports/objects -e GIT_ALTERNATE_OBJECT_DIRECTORIES=/repo/.git/objects \
            "$GITLEAKS_IMAGE" git /repo \
            --log-opts="$range --full-history --diff-merges=remerge --text --no-ext-diff --no-textconv" \
            --redact=100 --no-banner --log-level error --timeout "$SCAN_TIMEOUT_SECONDS" --exit-code "$FINDINGS_EXIT_CODE" \
            --report-format json --report-path /reports/findings.json \
            >/dev/null 2>"$report/errors" || status=$?
          # Upstream can log a Git-source error while returning zero.
          if [[ "$status" == 125 || "$status" == 126 || "$status" == 127 ]]; then
            echo "Secret scan could not start Docker or Gitleaks (exit $status)." >&2
            exit 1
          elif [[ -s "$report/errors" || ( "$status" != 0 && "$status" != "$FINDINGS_EXIT_CODE" ) ]]; then
            category='scanner execution'
            if grep -Eiq 'config|toml|allowlist' "$report/errors"; then
              category='configuration'
            elif grep -Eiq 'permission denied|read-only file system|report|no such file' "$report/errors"; then
              category='filesystem/report'
            elif grep -Eiq 'git|repository|revision|object|fatal:' "$report/errors"; then
              category='Git history'
            fi
            echo "Secret scan error: $category (exit $status); raw diagnostics are withheld." >&2
            exit 1
          fi
          jq -c '.[] | {rule: .RuleID, file: .File, line: .StartLine, commit: .Commit, "ignore-id": .Fingerprint}' "$report/findings.json"
          count=$(jq length "$report/findings.json")
          echo "finding-count=$count" >> "$GITHUB_OUTPUT"
          echo "Gitleaks: $count potential finding(s). See docs/secret-scanning.md for remediation and native exceptions."
          exit "$status"

  release-and-publish:
    needs: secret-scan
    name: Create Release and Publish Packages
    # Only run if ALL conditions are met:
    # 1. PR was actually merged (not just closed)
    # 2. Source branch starts with "release/"
    # 3. PR title starts with "Release v"
    # 4. PR has the "release" label
    if: |
      needs.secret-scan.result == 'success' &&
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/') &&
      startsWith(github.event.pull_request.title, 'Release v') &&
      contains(github.event.pull_request.labels.*.name, 'release')

    runs-on: ubuntu-latest
    permissions:
      contents: write        # Required to create releases
      packages: write        # Required to publish to GitHub Packages
      pull-requests: write   # Required to comment on PR
      id-token: write        # Required for npm trusted publishing (OIDC)

    steps:
      # ============================================
      # Phase 1: Prepare and Validate
      # ============================================
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.secret-scan.outputs.commit }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Verify tag exists
        env:
          SCANNED_TAG_COMMIT: ${{ needs.secret-scan.outputs.tag-commit }}
        run: |
          git fetch --tags
          if ! git tag -l "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "Error: Tag v${{ steps.version.outputs.version }} does not exist"
            echo "This should have been created by the prepare-release script."
            exit 1
          fi
          test "$(git rev-parse --verify "refs/tags/v${{ steps.version.outputs.version }}^{commit}")" = "$SCANNED_TAG_COMMIT"
          echo "✓ Tag v${{ steps.version.outputs.version }} exists at the scanned commit"

      - name: Validate version match
        run: |
          TAG_VERSION=${{ steps.version.outputs.version }}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Git tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

          echo "✓ Version validation passed: $PACKAGE_VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          if gh release view v${{ steps.version.outputs.version }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Release already exists, will skip creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✓ Release does not exist, will create"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # Phase 2: Create GitHub Release
      # ============================================
      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          gh release create v${{ steps.version.outputs.version }} \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes
          echo "✅ Created release v${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # Phase 3: Build and Test
      # ============================================
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      # ============================================
      # Phase 4: Publish to npm Registries
      # ============================================
      # Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN required.
      # This relies on a trusted publisher configured at npmjs.com for
      # @with-logic/fast-forward pointing at this repo AND this workflow
      # filename (release-and-publish.yml). Renaming this file will break
      # publishing until the npmjs.com config is updated to match.
      # Requires npm >= 11.5.1 and Node >= 22.14.0 (Node 24.x ships npm 11.6.x).
      - name: Setup Node.js for public npm
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Publish to public npm registry
        run: npm publish --access public

      # GitHub Packages is a separate registry and does NOT participate in npm's
      # trusted publishing (OIDC). It authenticates with the per-run GITHUB_TOKEN,
      # which is auto-minted by Actions and needs no manual rotation — so this
      # step is unaffected by npm's deprecation of long-lived tokens.
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # Phase 5: Notify
      # ============================================
      - name: Add comment to PR
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body \
              "🚀 Release [v${{ steps.version.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}) has been created and published!

              **Published packages:**
              - 📦 [npm registry](https://www.npmjs.com/package/@with-logic/fast-forward/v/${{ steps.version.outputs.version }})
              - 📦 [GitHub Packages](https://github.com/${{ github.repository }}/pkgs/npm/fast-forward)

              **Installation:**
              \`\`\`bash
              npm install @with-logic/fast-forward@${{ steps.version.outputs.version }}
              \`\`\`"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body \
              "❌ Release workflow failed for v${{ steps.version.outputs.version }}

              **View logs:** [Workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

              Please check the logs and retry if needed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
